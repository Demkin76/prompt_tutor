name: Frontend

on:
  workflow_run:
    workflows: [Backend]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve Backend run to take artifacts from
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id='${{ github.event.workflow_run.id }}'
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow backend.yml --branch "${{ github.event.repository.default_branch || 'main' }}" \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "No successful Backend run found — run the Backend workflow first." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Brings in convex/_generated (needed by tsc) and .env.production
      # (VITE_CONVEX_URL), so this job needs no Convex credentials.
      - name: Download Convex artifacts
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: .
          run-id: ${{ steps.backend.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
