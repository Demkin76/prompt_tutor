name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Convex
    runs-on: ubuntu-latest
    # CONVEX_PRODUCTION_DEPLOY_KEY lives in this environment; harmless if the
    # secret is defined at repository level instead.
    environment: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # convex/_runner/bundle.ts is generated, not committed, and is imported
      # by the Convex actions — it has to exist before codegen/typecheck.
      - name: Build runner bundle
        run: npm run build:runner

      - name: Generate Convex code
        run: npx convex codegen --typecheck disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      # `--cmd` runs *before* codegen, so it may only write .env.production.
      - name: Push functions to Convex production
        run: >
          npx convex deploy
          --typecheck disable
          --cmd "node scripts/write-frontend-env.mjs"
          --cmd-url-env-var-name VITE_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}

      - name: Upload Convex artifacts
        uses: actions/upload-artifact@v4
        with:
          name: convex-generated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            convex/_generated
            .env.production

  frontend:
    name: Pages
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Brings in convex/_generated (needed by tsc) and .env.production
      # (VITE_CONVEX_URL), so this job needs no Convex credentials.
      - name: Download Convex artifacts
        uses: actions/download-artifact@v4
        with:
          name: convex-generated
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
